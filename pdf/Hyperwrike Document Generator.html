<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hyperwrike — Document Generator</title>
<link rel="stylesheet" href="assets/brand.css" />
<style>
  /* ====== APP CHROME ====== */
  :root {
    --app-bg: #EEF1F6;
    --app-panel: #FFFFFF;
    --app-ink: #15203A;
    --app-muted: #5A6B82;
    --app-faint: #8A98AB;
    --app-line: rgba(21,32,58,0.12);
    --app-line-soft: rgba(21,32,58,0.07);
    --accent: #4C7A0C;
    --accent-bright: #A6E635;
    --accent-soft: rgba(166,230,53,0.16);
    --gold: #A6842C;
    --sheet-h: 297mm;
    --ui: 'Space Grotesk', system-ui, sans-serif;
    --ui-body: 'DM Sans', system-ui, sans-serif;
    --ui-mono: 'JetBrains Mono', monospace;
  }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--app-bg);
    font-family: var(--ui-body);
    color: var(--app-ink);
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: var(--ui); cursor: pointer; }

  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ---- top bar ---- */
  .topbar {
    height: 60px; flex: none;
    background: #fff;
    border-bottom: 1px solid var(--app-line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    z-index: 30;
  }
  .tb-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; }
  .tb-name { font-family: var(--ui); font-weight: 700; font-size: 16px; color: var(--app-ink); letter-spacing: 0.02em; line-height: 1; }
  .tb-sub { font-family: var(--ui); font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--app-faint); margin-top: 3px; }
  .tb-actions { display: flex; align-items: center; gap: 10px; }
  .save-pill {
    font-family: var(--ui-mono); font-size: 10px; color: var(--app-faint);
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--app-line-soft);
    transition: color .2s, border-color .2s;
  }
  .save-pill.on { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }

  .btn {
    border: 1px solid var(--app-line); background: #fff; color: var(--app-ink);
    font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 7px;
    transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--app-ink); }
  .btn.ghost { color: var(--app-muted); }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ---- main split ---- */
  .main { flex: 1; display: grid; grid-template-columns: minmax(420px, 520px) 1fr; min-height: 0; }

  /* ---- form pane ---- */
  .form-pane { background: #fff; border-right: 1px solid var(--app-line); overflow-y: auto; }
  .form-inner { padding: 18px 22px 80px; max-width: 560px; }

  .fsec { border: 1px solid var(--app-line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: #fff; }
  .fsec.open { box-shadow: 0 2px 12px -8px rgba(21,32,58,0.18); }
  .fsec-head {
    width: 100%; border: none; background: transparent;
    display: flex; align-items: center; gap: 11px;
    padding: 13px 15px; text-align: left;
  }
  .fsec.open .fsec-head { border-bottom: 1px solid var(--app-line-soft); }
  .fsec-n { font-family: var(--ui-mono); font-size: 11px; font-weight: 700; color: var(--accent); }
  .fsec-title { font-family: var(--ui); font-weight: 600; font-size: 13px; flex: 1; letter-spacing: 0.01em; }
  .fsec-chev { font-size: 17px; color: var(--app-faint); font-weight: 400; width: 16px; text-align: center; }
  .fsec-body { padding: 15px; display: flex; flex-direction: column; gap: 13px; }

  .sec-note { font-size: 11px; color: var(--app-muted); margin: -2px 0 2px; }

  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld-label { font-family: var(--ui); font-size: 11px; font-weight: 600; color: var(--app-ink); display: flex; align-items: baseline; gap: 7px; }
  .fld-hint { font-family: var(--ui-body); font-weight: 400; font-size: 10px; color: var(--app-faint); }
  .req { color: var(--gold); }
  .fld input, .fld textarea, .item-grid input, .list-row input, .tl-phase {
    width: 100%; border: 1px solid var(--app-line); border-radius: 7px;
    padding: 9px 11px; font-family: var(--ui-body); font-size: 12.5px; color: var(--app-ink);
    background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  .fld textarea { resize: vertical; line-height: 1.5; }
  .fld input:focus, .fld textarea:focus, .item-grid input:focus, .list-row input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .fld input:disabled { background: #F4F6F9; color: var(--app-faint); }
  .fld-err input, .fld-err textarea { border-color: var(--alert); }
  .fld-error { font-size: 10.5px; color: var(--alert); font-weight: 500; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* segmented */
  .seg { display: flex; border: 1px solid var(--app-line); border-radius: 7px; overflow: hidden; }
  .seg button {
    flex: 1; border: none; background: #fff; padding: 9px 6px; font-size: 11.5px; font-weight: 600;
    color: var(--app-muted); border-right: 1px solid var(--app-line); transition: all .12s;
  }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--app-ink); color: #fff; }

  /* logo upload */
  .logo-field { min-height: 40px; }
  .logo-drop {
    display: flex; align-items: center; justify-content: center;
    border: 1.5px dashed var(--app-line); border-radius: 7px; padding: 10px;
    font-family: var(--ui); font-size: 12px; font-weight: 600; color: var(--app-muted);
    cursor: pointer; transition: all .15s;
  }
  .logo-drop:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .logo-drop input { display: none; }
  .logo-prev { display: flex; align-items: center; gap: 10px; }
  .logo-prev img { max-height: 38px; max-width: 110px; border: 1px solid var(--app-line); border-radius: 5px; padding: 3px; background: #fff; }
  .logo-x { border: none; background: none; color: var(--alert); font-size: 11px; font-weight: 600; }

  /* list rows */
  .list-row { display: flex; align-items: center; gap: 8px; }
  .list-bul {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-family: var(--ui-mono); font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
  }
  .tl-phase { flex: none; width: 120px; }
  .row-del {
    flex: none; width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--app-line); background: #fff; color: var(--app-faint);
    font-size: 17px; line-height: 1; display: grid; place-items: center;
  }
  .row-del:hover:not(:disabled) { border-color: var(--alert); color: var(--alert); }
  .row-del:disabled { opacity: .35; cursor: default; }
  .add-row {
    align-self: flex-start; border: 1px dashed var(--app-line); background: #fff;
    color: var(--accent); font-size: 11.5px; font-weight: 600; padding: 7px 13px; border-radius: 7px;
    transition: all .15s;
  }
  .add-row:hover { background: var(--accent-soft); border-color: var(--accent); }

  /* line items grid */
  .items-head { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .items-head > span:first-child { font-family: var(--ui); font-size: 11px; font-weight: 600; }
  .items-err { font-size: 10.5px; color: var(--alert); font-weight: 500; }
  .item-grid { display: grid; grid-template-columns: 1fr 48px 78px 78px 26px; gap: 7px; align-items: center; }
  .item-grid-head { padding: 0 1px; }
  .item-grid-head span { font-family: var(--ui); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--app-faint); font-weight: 600; }
  .item-grid-head span:nth-child(2), .item-grid-head span:nth-child(3), .item-grid-head span:nth-child(4) { text-align: right; }
  .item-grid input:nth-child(2), .item-grid input:nth-child(3) { text-align: right; }
  .item-amt { font-family: var(--ui-mono); font-size: 11px; text-align: right; color: var(--app-ink); font-weight: 600; }

  .totals-mini {
    margin-top: 13px; border: 1px solid var(--app-line); border-radius: 8px;
    padding: 11px 14px; background: #FAFBFD;
  }
  .totals-mini > div { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: var(--app-muted); }
  .totals-mini b { font-family: var(--ui-mono); color: var(--app-ink); }
  .totals-mini .tm-total { border-top: 1px solid var(--app-line); margin-top: 4px; padding-top: 7px; font-weight: 700; color: var(--app-ink); }
  .totals-mini .tm-total b { color: var(--accent); font-size: 14px; }

  /* ---- preview pane ---- */
  .preview-pane { display: flex; flex-direction: column; min-width: 0; background: var(--app-bg); }
  .preview-bar {
    flex: none; height: 56px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--app-line); background: #fff;
  }
  .tabs { display: flex; gap: 4px; background: #EEF1F6; padding: 4px; border-radius: 9px; }
  .tab {
    border: none; background: transparent; padding: 7px 16px; border-radius: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--app-muted); transition: all .12s;
  }
  .tab.on { background: #fff; color: var(--app-ink); box-shadow: 0 1px 4px rgba(21,32,58,0.1); }
  .dl-actions { display: flex; gap: 8px; }
  .btn.dl {
    background: var(--app-ink); color: #fff; border-color: var(--app-ink);
    min-width: 150px; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn.dl:hover:not(:disabled) { background: #1d2c4d; }
  .btn.dl-all {
    background: var(--accent-bright); color: var(--app-ink); border-color: var(--accent-bright);
    font-weight: 700; min-width: 150px; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn.dl-all:hover:not(:disabled) { filter: brightness(1.04); }

  .preview-scroll { flex: 1; overflow: auto; padding: 24px; display: flex; justify-content: center; }
  .sheet-scaler { transform-origin: top center; flex: none; }
  .live-sheet .doc-sheet { box-shadow: 0 14px 50px -20px rgba(21,32,58,0.4); }

  /* ---- DOC SHEET (shared) ---- */
  .doc-sheet {
    width: 210mm; min-height: 297mm; background: #fff;
    padding: 16mm 18mm; position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    font-family: var(--body); color: var(--ink);
  }
  .doc-sheet::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent-bright) 0%, var(--accent-bright) 38%, transparent 38%, transparent 62%, var(--gold) 62%, var(--gold) 100%);
  }
  /* client logo block */
  .client-logo-wrap { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .cl-label { font-family: var(--label); text-transform: uppercase; letter-spacing: 0.2em; font-size: 8px; color: var(--muted-2); }
  .client-logo-img { max-height: 40px; max-width: 150px; object-fit: contain; }
  .client-logo-ph {
    font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--ink);
    border: 1px dashed var(--hairline); border-radius: 5px; padding: 7px 14px; min-width: 90px; text-align: center;
  }
  .hw-logo-link .logo .bar { fill: var(--ink); }
  .hw-logo-link .logo .trend { stroke: var(--accent-bright); }
  .hw-logo-link .logo .node { fill: var(--accent-bright); }

  .doc-sheet .content { padding-left: 16px; border-left: 3px solid var(--accent); }
  .doc-sheet .content.gold-edge { border-left-color: var(--gold); }

  /* ---- busy overlay + toast ---- */
  .busy-overlay { position: fixed; inset: 0; background: rgba(21,32,58,0.45); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 60; }
  .busy-card {
    background: #fff; border-radius: 12px; padding: 26px 34px; display: flex; flex-direction: column;
    align-items: center; gap: 14px; font-family: var(--ui); font-weight: 600; font-size: 13px; color: var(--app-ink);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.4);
  }
  .spin {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    display: inline-block; animation: sp .7s linear infinite;
  }
  .btn.dl-all .spin { border: 2px solid rgba(21,32,58,0.3); border-top-color: var(--app-ink); }
  .spin.big { width: 30px; height: 30px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); }
  @keyframes sp { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--app-ink); color: #fff; padding: 11px 20px; border-radius: 9px;
    font-family: var(--ui); font-size: 12.5px; font-weight: 600; z-index: 70;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
    animation: toastin .25s ease;
  }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 10px); } }

  /* hidden full-size stage */
  #pdf-stage { position: fixed; left: -9999px; top: 0; width: 210mm; }

  /* responsive */
  @media (max-width: 920px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .form-pane { border-right: none; border-bottom: 1px solid var(--app-line); }
    .preview-bar { flex-wrap: wrap; height: auto; padding: 10px 14px; gap: 8px; }
    .btn.dl, .btn.dl-all { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

</body>
</html>
